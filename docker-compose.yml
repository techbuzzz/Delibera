# ───────────────────────────────────────────────────────────────────────────────
# Delibera — full stack
#
# Quickstart (Ollama on host, external LLM provider):
#   docker compose up delibera-server qdrant postgres
#
# Quickstart (everything, Ollama included, on GPU):
#   docker compose --profile ollama up
#
# After 10.5.2, published ports bind to 127.0.0.1 only. The API is
# UNAUTHENTICATED and UNTHROTTLED by design — anyone who can reach the port can run
# paid LLM debates — so it must not be exposed to a network you do not control. Put an
# authenticating reverse proxy in front before doing that.
#
# Copy .env.example -> .env and fill in your values before first run.
# ───────────────────────────────────────────────────────────────────────────────
name: delibera

networks:
  delibera-net:
    driver: bridge

services:

  # ───────────────────────────────────────────────────────────────────────────
  # Delibera Server — REST API + MCP endpoint
  # ───────────────────────────────────────────────────────────────────────────
  delibera-server:
    build:
      context: .
      dockerfile: src/Delibera.Server/Dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Release}
    image: delibera-server:${IMAGE_TAG:-latest}
    container_name: delibera-server
    restart: unless-stopped
    # Comment this line if you don't need to access host services from inside the container (e.g., Ollama on host)
    extra_hosts:
    - "host.docker.internal:host-gateway"
    networks:
      - delibera-net
    ports:
      # 127.0.0.1 only — see the header warning. The API has no auth and no rate limit.
      - "127.0.0.1:${DELIBERA_PORT:-5200}:8080"
    volumes:
      - debate-results:/app/debate_results
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # — LLM provider —
      Delibera__Providers__DefaultType:     ${DELIBERA_PROVIDER_TYPE:-Ollama}
      Delibera__Providers__DefaultEndpoint: ${DELIBERA_PROVIDER_ENDPOINT:-http://ollama:11434}
      Delibera__Providers__DefaultModel:    ${DELIBERA_MODEL:-qwen2.5:14b}
      Delibera__Providers__EmbeddingModel:  ${DELIBERA_EMBEDDING_MODEL:-nomic-embed-text}
      Delibera__Providers__ApiKey:          ${DELIBERA_API_KEY:-}
      # — council models —
      # The built-in templates (code-review, architecture-decision, risk-committee,
      # requirements-review, legal-contract-review) read these two keys, NOT
      # Delibera:Providers:DefaultModel, to pick their fast and strong participants.
      # Without them every template falls back to llama3.2:3b / qwen2.5:7b, which
      # Ollama Cloud answers with HTTP 404 — so setting DELIBERA_MODEL alone produced a
      # server that started healthy and then failed on the first real debate.
      Delibera__Models__Fast:               ${DELIBERA_MODELS_FAST:-llama3.2:3b}
      Delibera__Models__Strong:             ${DELIBERA_MODELS_STRONG:-qwen2.5:7b}
      # — debate defaults —
      Delibera__Strategy:    ${DELIBERA_STRATEGY:-Standard}
      Delibera__MaxRounds:   ${DELIBERA_MAX_ROUNDS:-4}
      Delibera__Temperature: ${DELIBERA_TEMPERATURE:-0.7}
      # — compression —
      Delibera__Compression__Enabled:      ${DELIBERA_COMPRESSION_ENABLED:-true}
      Delibera__Compression__Strategy:     ${DELIBERA_COMPRESSION_STRATEGY:-Hybrid}
      Delibera__Compression__TargetRatio:  ${DELIBERA_COMPRESSION_TARGET_RATIO:-0.5}
      # — RAG —
      Delibera__Rag__Enabled:           ${DELIBERA_RAG_ENABLED:-false}
      Delibera__Rag__ProviderType:      ${DELIBERA_RAG_PROVIDER:-Qdrant}
      # Qdrant is addressed over gRPC, so it needs Host/Port — ConnectionString below is only
      # consulted by the pgvector provider.
      Delibera__Rag__Host:               ${DELIBERA_RAG_HOST:-qdrant}
      Delibera__Rag__Port:               ${DELIBERA_RAG_PORT:-6334}
      Delibera__Rag__CollectionName:     ${DELIBERA_RAG_COLLECTION:-council_knowledge}
      Delibera__Rag__ConnectionString:  ${DELIBERA_RAG_CONNECTION:-http://qdrant:6333}
      # — output —
      Delibera__Output__Directory:      /app/debate_results
      Delibera__Output__SeparateFiles:  true
      # — observability —
      Delibera__Server__Telemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # — Redis (opt-in; off by default) —
      # When Enabled is true the server replaces its in-process orchestrator with
      # RedisDebateOrchestrator and shares round events/state through Redis Streams.
      # This is NOT distributed turn execution: DebateWorkerService is a no-op
      # placeholder, so a debate still runs in the process that accepted it.
      Delibera__Redis__Enabled:            ${DELIBERA_REDIS_ENABLED:-false}
      Delibera__Redis__CacheEnabled:       ${DELIBERA_REDIS_CACHE_ENABLED:-false}
      Delibera__Redis__ConnectionString:   ${DELIBERA_REDIS_CONNECTION:-redis:6379,abortConnect=false}
      Delibera__Redis__StreamMaxLength:    ${DELIBERA_REDIS_STREAM_MAX_LENGTH:-10000}
      Delibera__Redis__StateKeyTtl:        ${DELIBERA_REDIS_STATE_TTL:-24:00:00}
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ───────────────────────────────────────────────────────────────────────────
  # Delibera WebUI — Nuxt 4 front end (debates: list, create, live SSE, verdict)
  #
  # The browser never talks to delibera-server directly: the API registers no CORS
  # policy, so a cross-origin call would be blocked. This container proxies every API
  # call server-side through Nitro, keeping the browser on one origin.
  # ───────────────────────────────────────────────────────────────────────────
  delibera-webui:
    build:
      # Context is the WebUI folder, not the repository root: the Dockerfile copies
      # package.json / package-lock.json by those exact paths, and a root context would make
      # them src/Delibera.WebUI/... . It also picks up the folder's own .dockerignore, so a
      # local node_modules never reaches the daemon.
      context: ./src/Delibera.WebUI
      dockerfile: Dockerfile
    image: delibera-webui:${IMAGE_TAG:-latest}
    container_name: delibera-webui
    restart: unless-stopped
    networks:
      - delibera-net
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Server-only runtime config. The browser sees just the same-origin /api/delibera proxy.
      NUXT_DELIBERA_API_BASE: http://delibera-server:8080
      NUXT_PUBLIC_TENANT_ID: ${DELIBERA_TENANT_ID:-default}
    depends_on:
      delibera-server:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ───────────────────────────────────────────────────────────────────────────
  # Redis — debate state + round events (opt-in; see Delibera:Redis:Enabled)
  #
  # No host port: the server reaches it over delibera-net, and publishing it would add an
  # attack surface for no benefit.
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: delibera-redis
    restart: unless-stopped
    networks:
      - delibera-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ───────────────────────────────────────────────────────────────────────────
  # Ollama — local LLM (GPU). Start with: docker compose --profile ollama up
  # ───────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: delibera-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    networks:
      - delibera-net
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Pulls required models into Ollama after it is healthy
  ollama-pull:
    image: curlimages/curl:latest
    container_name: delibera-ollama-pull
    profiles: ["ollama"]
    networks:
      - delibera-net
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for model in ${OLLAMA_PULL_MODELS:-qwen2.5:14b nomic-embed-text}; do
          echo "Pulling $$model ..."
          curl -sS -X POST http://ollama:11434/api/pull \
               -H 'Content-Type: application/json' \
               -d "{\"name\":\"$$model\"}" \
          || echo "WARNING: failed to pull $$model"
        done
        echo "Model pull finished."
    restart: "no"

  # ───────────────────────────────────────────────────────────────────────────
  # Qdrant — vector store for RAG
  # ───────────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: delibera-qdrant
    restart: unless-stopped
    networks:
      - delibera-net
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    # The qdrant/qdrant image ships bash but no wget, curl or nc, and its /bin/sh is dash
    # (no /dev/tcp) — a wget-based check therefore fails forever. Bash's /dev/tcp does the job.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && timeout 5 head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ───────────────────────────────────────────────────────────────────────────
  # PostgreSQL + pgvector — alternative vector store
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: delibera-postgres
    restart: unless-stopped
    networks:
      - delibera-net
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-council_vectors}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-council_vectors}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  debate-results:
  ollama-data:
  qdrant-data:
  postgres-data:
  redis-data:
