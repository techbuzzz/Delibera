# ───────────────────────────────────────────────────────────────────────────────
# Delibera — published images, no build required.
#
#   curl -O https://raw.githubusercontent.com/techbuzzz/Delibera/main/deploy/docker-compose.hub.yml
#   docker compose -f docker-compose.hub.yml up -d
#
# Runs against techbuzzz/delibera-server and techbuzzz/delibera-webui from Docker Hub.
# To use a specific version, set DELIBERA_VERSION — it defaults to `latest`.
#
# SECURITY: the Delibera API is UNAUTHENTICATED and UNTHROTTLED. Every published port is
# bound to 127.0.0.1 for that reason. Do not change those bindings to 0.0.0.0 without
# putting an authenticating reverse proxy in front first.
#
# Ollama is deliberately not pulled from the registry: it keeps its `ollama` profile, so
# `docker compose --profile ollama up` still adds it when you want a local GPU model.
# ───────────────────────────────────────────────────────────────────────────────
name: delibera

networks:
  delibera-net:
    driver: bridge

services:

  # ── REST API + MCP endpoint ────────────────────────────────────────────────
  delibera-server:
    image: techbuzzz/delibera-server:${DELIBERA_VERSION:-latest}
    container_name: delibera-server
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - delibera-net
    ports:
      - "127.0.0.1:${DELIBERA_PORT:-5200}:8080"
    volumes:
      - debate-results:/app/debate_results
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Delibera__Providers__DefaultType:     ${DELIBERA_PROVIDER_TYPE:-Ollama}
      Delibera__Providers__DefaultEndpoint: ${DELIBERA_PROVIDER_ENDPOINT:-http://host.docker.internal:11434}
      Delibera__Providers__DefaultModel:    ${DELIBERA_MODEL:-qwen2.5:14b}
      Delibera__Providers__EmbeddingModel:  ${DELIBERA_EMBEDDING_MODEL:-nomic-embed-text}
      Delibera__Providers__ApiKey:          ${DELIBERA_API_KEY:-}
      Delibera__Models__Fast:               ${DELIBERA_MODELS_FAST:-llama3.2:3b}
      Delibera__Models__Strong:             ${DELIBERA_MODELS_STRONG:-qwen2.5:7b}
      Delibera__Strategy:    ${DELIBERA_STRATEGY:-Standard}
      Delibera__MaxRounds:   ${DELIBERA_MAX_ROUNDS:-4}
      Delibera__Temperature: ${DELIBERA_TEMPERATURE:-0.7}
      Delibera__Compression__Enabled:      ${DELIBERA_COMPRESSION_ENABLED:-true}
      Delibera__Compression__Strategy:     ${DELIBERA_COMPRESSION_STRATEGY:-Hybrid}
      Delibera__Compression__TargetRatio:  ${DELIBERA_COMPRESSION_TARGET_RATIO:-0.5}
      Delibera__Rag__Enabled:           ${DELIBERA_RAG_ENABLED:-false}
      Delibera__Rag__ProviderType:      ${DELIBERA_RAG_PROVIDER:-Qdrant}
      Delibera__Rag__Host:               ${DELIBERA_RAG_HOST:-qdrant}
      Delibera__Rag__Port:               ${DELIBERA_RAG_PORT:-6334}
      Delibera__Rag__CollectionName:     ${DELIBERA_RAG_COLLECTION:-council_knowledge}
      Delibera__Rag__ConnectionString:   ${DELIBERA_RAG_CONNECTION:-http://qdrant:6333}
      Delibera__Output__Directory:     /app/debate_results
      Delibera__Output__SeparateFiles: true
      Delibera__Server__Telemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Delibera__Redis__Enabled:          ${DELIBERA_REDIS_ENABLED:-false}
      Delibera__Redis__CacheEnabled:     ${DELIBERA_REDIS_CACHE_ENABLED:-false}
      Delibera__Redis__ConnectionString: ${DELIBERA_REDIS_CONNECTION:-redis:6379,abortConnect=false}
      Delibera__Redis__StreamMaxLength:  ${DELIBERA_REDIS_STREAM_MAX_LENGTH:-10000}
      Delibera__Redis__StateKeyTtl:      ${DELIBERA_REDIS_STATE_TTL:-24:00:00}
      # CORS is OFF unless you list origins here. The bundled Web UI talks to this API through
      # its own same-origin BFF route and never needs it; set it only when a *static* client
      # (e.g. the GitHub Pages build) calls this API straight from the browser. List origins
      # explicitly — a wildcard would let any page on the internet spend credits here.
      Delibera__Server__Cors__AllowedOrigins__0: ${DELIBERA_CORS_ORIGIN:-}
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Web UI (Nuxt 4) ─────────────────────────────────────────────────────────
  delibera-webui:
    image: techbuzzz/delibera-webui:${DELIBERA_VERSION:-latest}
    container_name: delibera-webui
    restart: unless-stopped
    networks:
      - delibera-net
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NUXT_DELIBERA_API_BASE: http://delibera-server:8080
      NUXT_PUBLIC_TENANT_ID: ${DELIBERA_TENANT_ID:-default}
    depends_on:
      delibera-server:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis (opt-in via DELIBERA_REDIS_ENABLED) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: delibera-redis
    restart: unless-stopped
    networks:
      - delibera-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: delibera-qdrant
    restart: unless-stopped
    networks:
      - delibera-net
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && timeout 5 head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: delibera-postgres
    restart: unless-stopped
    networks:
      - delibera-net
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-council_vectors}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-council_vectors}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Optional local LLM (GPU) ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: delibera-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    networks:
      - delibera-net
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-pull:
    image: curlimages/curl:latest
    container_name: delibera-ollama-pull
    profiles: ["ollama"]
    networks:
      - delibera-net
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for model in ${OLLAMA_PULL_MODELS:-qwen2.5:14b nomic-embed-text}; do
          echo "Pulling $$model ..."
          curl -sS -X POST http://ollama:11434/api/pull \
               -H 'Content-Type: application/json' \
               -d "{\"name\":\"$$model\"}"
          || echo "WARNING: failed to pull $$model"
        done
        echo "Model pull finished."
    restart: "no"

volumes:
  debate-results:
  ollama-data:
  qdrant-data:
  postgres-data:
  redis-data: