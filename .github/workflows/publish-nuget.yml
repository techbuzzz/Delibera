name: publish-nuget

on:
  push:
    branches: [ main ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO:                     'true'
  DOTNET_CLI_TELEMETRY_OPTOUT:       'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES:                    ${{ github.workspace }}/.nuget-packages

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The solution at the repository ROOT is the one that includes the test
      # projects. src/Delibera.slnx lists only the four src projects, so building
      # it silently skips every test — which is how the NU1605 package drift in
      # the test projects reached a release unnoticed.
      - name: Restore
        run: dotnet restore Delibera.slnx

      - name: Build (Release, warnings are errors)
        run: dotnet build Delibera.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Delibera.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      # The GA matrix is Delibera.Core, Delibera.Server and Delibera.Redis.
      # Delibera.Grpc / Delibera.Grpc.Client carry the same packaging metadata and
      # are one line away from this list once they are published.
      - name: Pack
        run: |
          for proj in \
            src/Delibera.Core/Delibera.Core.csproj \
            src/Delibera.Server/Delibera.Server.csproj \
            src/Delibera.Redis/Delibera.Redis.csproj; do
            dotnet pack "$proj" -c Release --no-build --output ./artifacts
          done

      - name: Verify package layout (hash, no signature)
        run: |
          # Sanity-check the packages. `dotnet package list` is project-scoped —
          # it does NOT accept a .nupkg path — so it reports the dependency graph
          # we are about to publish. `unzip -l` stays as the archive listing.
          # We do NOT run `dotnet nuget verify` because it requires a code
          # signing certificate (NU3004) — overkill for an OSS package.
          ls -la ./artifacts
          for proj in \
            src/Delibera.Core/Delibera.Core.csproj \
            src/Delibera.Server/Delibera.Server.csproj \
            src/Delibera.Redis/Delibera.Redis.csproj; do
            echo "── $proj dependencies ──"
            dotnet package list --project "$proj" --include-transitive
          done
          # Every shipped package must carry its README and icon: a package without
          # them renders as a bare dependency line on nuget.org.
          for pkg in ./artifacts/*.nupkg; do
            echo "── $pkg ──"
            unzip -l "$pkg"
            unzip -l "$pkg" | grep -q 'README.md' || { echo "MISSING README.md in $pkg"; exit 1; }
            unzip -l "$pkg" | grep -q 'icon.png'  || { echo "MISSING icon.png in $pkg";  exit 1; }
          done

      # Symbol packages (.snupkg) are built too, so they must be uploaded and pushed with the
      # rest. IncludeSymbols/SymbolPackageFormat in each csproj is otherwise decoration: without
      # this they would be generated on every run and dropped, and consumers would get no
      # stack traces from the package.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-artifacts
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish to NuGet.org
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): GitHub issues a short-lived token bound to
    # this workflow; nuget.org validates it against the trusted publishing
    # policy configured on https://www.nuget.org and returns a temporary
    # API key (valid for ~1 hour). No NUGET_API_KEY secret required.
    permissions:
      id-token: write   # required for OIDC token issuance
      contents: read
    environment:
      name: nuget-prod
      url: https://www.nuget.org/packages/Delibera.Core
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-artifacts
          path: ./artifacts

      - name: NuGet login (OIDC → short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          # Use your nuget.org profile name (case-insensitive). DO NOT use email.
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          for pkg in ./artifacts/*.nupkg ./artifacts/*.snupkg; do
            [ -e "$pkg" ] || continue
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --skip-duplicate
          done
