name: pages

# Builds the Next.js site in site/ and publishes it to GitHub Pages on every merge to main.
#
# The site is a *view* over files that already live in this repository: the guides and
# release notes in docs/, the changelog, the version in Delibera.Core.csproj, and the debate
# templates in DebateTemplate.cs. Nothing is copied into a second location, so a page cannot
# advertise a version, a feature or a measurement the code does not have.
#
# The Nuxt Web UI is NOT deployed here. It ships in the container image
# (techbuzzz/delibera-webui) and is meant to run next to Delibera.Server, which provides the
# same-origin BFF route /api/delibera/**. A static export has no Nitro server and therefore
# no BFF, so the UI would need a separate CORS-enabled API origin — a deliberate owner
# decision, not something this workflow should configure silently.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new push supersedes an in-flight deploy; without this the second run would fail on the
# concurrency lock and leave the site one deploy behind.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        working-directory: site
        env:
          # configure-pages computes the prefix for this repo's Pages URL (/Delibera) and
          # Next.js needs it at build time — it is baked into every emitted href.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Verify the export
        run: node scripts/verify-export.mjs
        working-directory: site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4