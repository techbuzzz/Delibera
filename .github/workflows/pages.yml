name: Deploy Nuxt site to Pages

# Publishes the real Delibera Web UI to GitHub Pages as a static build.
#
# This is a STATIC export of the same app that ships in the container. The important
# consequence, which is not obvious from the workflow: `nuxt generate` produces no Nitro server,
# so the BFF route `/api/delibera/**` does not exist in the deployed site. The browser then needs
# an absolute API origin, supplied at build time by NUXT_PUBLIC_DELIBERA_API_BASE and resolved in
# app/composables/useDebates.ts. That server must allow this origin via CORS — Delibera.Server
# registers no CORS policy by default, because in its normal container deployment the browser
# only ever talks to the same-origin proxy.
#
# Without that env var the site still deploys and still renders, but every request 404s. That is
# a legitimate state for a UI preview; it is not a working install.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the in-progress and the
# latest queued. Do NOT cancel in-progress runs — let a production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          set -euo pipefail
          if [ -f "${{ github.workspace }}/src/Delibera.WebUI/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "command=install" >> "$GITHUB_OUTPUT"
          elif [ -f "${{ github.workspace }}/src/Delibera.WebUI/yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "command=install" >> "$GITHUB_OUTPUT"
          elif [ -f "${{ github.workspace }}/src/Delibera.WebUI/package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "command=ci" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no lockfile found in src/Delibera.WebUI" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: src/Delibera.WebUI/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Injects `router.base` and sets `target: 'static'` in nuxt.config.ts.
          static_site_generator: nuxt

      - name: Install dependencies
        working-directory: src/Delibera.WebUI
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Typecheck
        working-directory: src/Delibera.WebUI
        run: ${{ steps.detect-package-manager.outputs.manager }} run typecheck

      - name: Static HTML export with Nuxt
        working-directory: src/Delibera.WebUI
        env:
          # Empty by default: the site deploys as a UI preview whose API calls 404.
          # Set it as a repository variable to point the static build at a live server.
          NUXT_PUBLIC_DELIBERA_API_BASE: ${{ vars.NUXT_PUBLIC_DELIBERA_API_BASE }}
        run: ${{ steps.detect-package-manager.outputs.manager }} run generate

      - name: Fail if the export produced a real site
        run: |
          set -euo pipefail
          # `.output/public`, NOT `dist` — Nuxt 4 moved the static output there. GitHub's own
          # sample workflow still uploads ./dist because it predates Nuxt 4, and copying it
          # verbatim uploads nothing at all.
          #
          # The second assertion matters more: without an explicit nitro.prerender.routes list
          # the export contains only 200.html + 404.html and NO document for the real pages,
          # which deploys as a blank site that still reports a green build.
          out=src/Delibera.WebUI/.output/public
          if [ ! -f "$out/index.html" ]; then
            echo "::error::$out/index.html is missing — the site would deploy blank" >&2
            ls -la "$out" || true
            exit 1
          fi
          echo "prerendered: $(cd "$out" && find . -name '*.html' | sort | tr '\n' ' ')"
          echo "total files: $(find "$out" -type f | wc -l)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/Delibera.WebUI/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4